# Loaded automatically when Grafana starts (Phase 3).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  # Drift history tables written by monitoring/drift_job.py.
  # Inside Docker, Postgres is always postgres:5432, whatever port you mapped on your computer.
  - name: CardioGuard Postgres
    uid: cardio-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: ${POSTGRES_USER}
    jsonData:
      database: cardio
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
