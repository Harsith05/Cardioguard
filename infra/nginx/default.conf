# Nginx in front of the API (Phase 4). In Phase 6 this becomes the blue/green switch.
#
# The address is resolved through Docker's DNS on every request (resolver + variable),
# so restarting or scaling the api service (docker compose up --scale api=3) just works:
# nginx spreads requests over all api containers.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;          # batch of 1,000 patients is ~200 KB
    proxy_read_timeout 120s;          # "Run drift check" takes a few seconds

    set $api_upstream http://api:8000;

    # Prometheus scrapes each api container directly; no need to expose metrics publicly
    location = /metrics {
        return 404;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By $upstream_addr always;   # which api container answered
    }
}
